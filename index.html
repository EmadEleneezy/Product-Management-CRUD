<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
    <title>CRUD</title>
</head>
<body>

<nav class="navbar sola-navbar">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand sola-logo" href="#">
            <div class="logo-icon"><img src="c:\Users\DELL\OneDrive\الصور\لقطات الشاشة\photo_2026-09-11_18-09-34.jpg" alt=""></div>

            <div class="logo-text">
                <span class="logo-main">Sola Store</span>
                <span class="logo-sub">Kuwait Products</span>
            </div>
        </a>

        <!-- Navigation -->
        <div class="sola-nav">

            <a href="#productsTable" class="sola-nav-link active">
                Dashboard
            </a>

            <a href="#search" class="sola-nav-link">
                Search
            </a>

            <a href="#addProduct" class="add-product-link">
                + Add Product
            </a>

        </div>

    </div>
</nav>

    <div class="dashboard-header w-75 mx-auto">
    <h1>Product Management</h1>
    <p>Manage and organize your store products</p>
</div>

<div class="w-75 mx-auto my-5">
<div class="form-group"id="addProduct">
<label for="productName">productName :</label>
<input class="my-2 form-control" type="text"id="productName" >
<small class="text-muted">productName must be chars only</small>
</div>

<div class="form-group">
<label for="productPrice">productPrice :</label>
<input class="my-2 form-control" type="number"id="productPrice" >
</div>

<div class="form-group">
<label for="productCategory">productQuantity :</label>
<input class="my-2 form-control" type="text" id="productCategory" >
</div>

<div class="form-group">
<label for="productDesc">productDescription :</label>
<textarea class="my-2 form-control" type="text" id="productDesc" ></textarea>
</div>

<button id="mainBtn" onclick="addProduct()" class="my-2 btn btn-outline-info">Add Product</button>
</div>

<div class="w-75 mx-auto" id="search">
    <label for="">Search by productName</label>
    <input onkeyup="searchProduct(this.value)" class="form-control" type="text">
</div>
   
<div class="w-75 mx-auto my-5">
<table class="table"id="productsTable">
    <thead>
        <th>index</th>
        <th>productName</th>
        <th>productPrice</th>
        <th>Quantity</th>
        <th>Description</th>
        <th>Update</th>
        <th>Delete</th>
    </thead>
    <tbody id="tableBody">
        
    </tbody>
</table>


</div>

    <script src="main.js"></script>

    </body>
</html>
